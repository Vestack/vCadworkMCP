<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Plugin bar icon, 20x20, the size cadwork's own plugin icons use
     (3d.x64/py_plugins/ics_dxf_import/icon.svg, 3d.x64/Bcf/BcfBimCollab/Icon.png).
     A suspension bridge, for the bridge between Cadwork and the MCP client.
     Few strokes on purpose: it has to survive being drawn at 20 pixels. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="20mm" height="20mm" viewBox="0 0 20 20" version="1.1">
  <g fill="none" stroke="#1F3A5F" stroke-linecap="round" stroke-linejoin="round">
    <!-- main cable: anchorage, tower top, mid-span sag, tower top, anchorage -->
    <path stroke-width="1.25"
          d="M 1.3,13 C 3.0,7.0 4.6,4.4 6.0,4.3
             C 8.6,10.6 11.4,10.6 14.0,4.3
             C 15.4,4.4 17.0,7.0 18.7,13"/>
    <!-- hangers -->
    <path stroke-width="0.7" d="M 8.4,7.9 V 13 M 10,8.9 V 13 M 11.6,7.9 V 13"/>
    <!-- towers -->
    <path stroke-width="1.5" d="M 6,3.6 V 13 M 14,3.6 V 13"/>
  </g>
  <!-- deck -->
  <path d="M 1,13 H 19" fill="none" stroke="#C1663B" stroke-width="1.9"
        stroke-linecap="round"/>
</svg>
